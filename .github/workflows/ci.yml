name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer le paquet et ses dependances de developpement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Analyse statique
        run: python -m ruff check src tests tools

      - name: Tests
        run: python -m pytest -q

  overlay:
    name: Tests avec l'overlay (PySide6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliotheques systeme requises par Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Installer avec les extras overlay et serveur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,overlay]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Les icones du paquet sont a jour
        run: |
          python tools/make_icons.py
          git diff --exit-code -- src/overmlay/webapp
