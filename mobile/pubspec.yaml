name: overlay_perf
description: "Telemetrie temps reel du PC (FPS, temperatures, charges, ventilateurs) en direct sur Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0
  http: ^1.6.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Icone reprise du meme dessin que l'overlay a l'ecran et l'executable Windows
# (barres croissantes). Regenerer avec : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0F17"
  adaptive_icon_foreground: android/app/src/main/res/drawable/ic_launcher_foreground.png
