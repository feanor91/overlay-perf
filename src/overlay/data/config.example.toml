# Configuration d'Overlay.
#
# Copiez ce fichier a l'emplacement attendu avec « overlay config --init »,
# ou passez-le explicitement : « overlay --config mon-fichier.toml run ».
# Toute option omise garde sa valeur par defaut.

[general]
# Periode d'echantillonnage des capteurs, en secondes.
# 1.0 suffit pour les temperatures ; descendez a 0.5 pour un compteur plus vif.
poll_interval = 1.0

# Remplace tous les capteurs par des valeurs simulees : pratique pour regler
# l'affichage ou faire une demonstration sans materiel.
mock = false

# Nombre de mesures conservees pour les courbes (300 = 5 min a 1 Hz).
history_size = 300


[sensors]
# Publier la charge de chaque coeur en plus de la charge globale.
per_core = false

# Publier les debits disque et reseau.
include_io = true

# Backends a ne pas charger : "psutil", "hwmon", "rapl", "amdgpu", "nvidia", "lhm".
disabled = []

# Windows uniquement : serveur web interne de LibreHardwareMonitor.
# A activer dans LibreHardwareMonitor via Options > Remote Web Server > Run.
lhm_url = "http://127.0.0.1:8085/data.json"


[fps]
# Source des images par seconde :
#   auto       detection selon la plateforme (PresentMon puis MangoHud)
#   presentmon Windows, via PresentMon (Intel) — a lancer en administrateur
#   mangohud   Linux, en suivant les journaux CSV de MangoHud
#   push       aucune source locale : seul POST /api/fps/frame alimente le compteur
#   off        desactive completement la mesure du FPS
mode = "auto"

# Chemin de PresentMon.exe s'il n'est pas dans le PATH.
presentmon_path = ""

# Dossier ou MangoHud depose ses journaux.
# Cote jeu : MANGOHUD_CONFIG=output_folder=<ce dossier>,autostart_log=1 mangohud %command%
mangohud_log_dir = ""

# Duree de la moyenne glissante du compteur, en secondes.
window_seconds = 1.0


[server]
enabled = true

# 0.0.0.0 rend le serveur joignable depuis le telephone.
# Mettez 127.0.0.1 pour interdire tout acces depuis le reseau.
host = "0.0.0.0"
port = 8777

# Laisse vide : un jeton aleatoire est genere puis conserve dans le repertoire de
# donnees de l'utilisateur. « overlay pair » l'affiche avec un QR code.
# Une chaine vide ici ET un fichier de jeton absent desactiveraient toute
# authentification : ne renseignez "" que sur un reseau de confiance.
token = ""

# Mesures envoyees a l'application mobile. Vide = toutes.
# Le telephone peut de toute facon masquer ce qu'il ne veut pas voir.
metrics = []

# --- Acces depuis un autre reseau -------------------------------------------
#
# Par defaut l'agent n'est joignable que sur le reseau local. Pour y acceder
# depuis l'exterieur, la voie recommandee est un tunnel ou un VPN qui termine le
# TLS a votre place (Tailscale, Cloudflare Tunnel...) : voir le README. Ouvrir un
# port sur la box expose la machine aux balayages automatises d'Internet.

# URL publique de l'agent, quand un tunnel est en place. C'est elle qui part dans
# le QR code de « overlay pair ». Laissez vide sans acces distant.
public_url = ""

# A activer quand un tunnel ou un reverse proxy se trouve devant l'agent : les
# en-tetes X-Forwarded-For et X-Forwarded-Proto sont alors prises en compte, ce
# qui permet d'identifier le vrai client. Sans proxy, laissez false : ces
# en-tetes sont triviales a forger et contourneraient le verrouillage ci-dessous.
behind_proxy = false

# Adresses autorisees a presenter ces en-tetes ("*" pour toutes). Un tunnel
# installe sur la meme machine sort de 127.0.0.1.
trusted_proxies = "127.0.0.1"

# Certificat et cle privee pour servir directement en HTTPS. Inutiles quand le
# tunnel termine deja le TLS, ce qui est le cas courant. Attention : un
# certificat auto-signe empeche l'installation de l'application sur le telephone,
# les navigateurs refusant les service workers hors origine sure et approuvee.
#
# Chemins Windows : en TOML, la barre inverse ouvre une sequence d'echappement,
# et "C:\Users\moi\cert.pem" est refuse a la lecture du fichier. Ecrivez plutot
# des barres obliques, que Windows accepte tout aussi bien :
#   tls_cert = "C:/Users/moi/cert.pem"
tls_cert = ""
tls_key = ""

# Verrouillage d'une adresse apres des echecs d'authentification repetes. C'est
# ce qui rend une attaque par force brute sans interet une fois l'agent joignable
# depuis Internet.
max_auth_failures = 10
auth_lockout_seconds = 300


[overlay]
enabled = true

# top-left, top-right, bottom-left, bottom-right
position = "top-left"

# Distance aux bords de l'ecran, en pixels.
margin = 24

# Opacite globale, de 0.05 a 1.0.
opacity = 0.85

font_size = 14

# Repartir les lignes sur plusieurs colonnes.
columns = 1

# Laisser passer les clics vers le jeu situe dessous.
click_through = true

# Raccourci global d'affichage (syntaxe pynput).
# Exemples : "<ctrl>+<alt>+o", "<shift>+<f10>", "<ctrl>+<shift>+m"
hotkey = "<ctrl>+<alt>+o"

visible_at_start = true

# Mesures affichees, dans l'ordre. Un « * » final agit comme un prefixe.
# « overlay sensors » liste les cles reellement disponibles sur votre machine.
metrics = [
    "fps.current",
    "fps.low1",
    "fps.frametime",
    "cpu.load",
    "cpu.temp",
    "cpu.power",
    "temp.coretemp.*",
    "temp.k10temp.*",
    "gpu.0.load",
    "gpu.0.temp",
    "gpu.0.power",
    "gpu.0.vram.used",
    "memory.load",
    "fan.*",
]
