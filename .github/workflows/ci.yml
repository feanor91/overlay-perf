name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    # Executable Windows (dotnet/) : compilation, tests unitaires, puis publication de
    # OverlayPerf.exe en artefact telechargeable depuis la page du run.
    name: OverlayPerf.exe (C#/.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurer
        run: dotnet restore dotnet/OverlayPerf.sln

      - name: Tests
        run: dotnet test dotnet/OverlayPerf.sln --no-restore -c Release

      - name: Publier l'executable unique
        run: dotnet publish dotnet/OverlayPerf/OverlayPerf.csproj --no-restore -c Release -o dotnet/publish

      - uses: actions/upload-artifact@v4
        with:
          name: OverlayPerf-win-x64
          path: dotnet/publish/OverlayPerf.exe
          if-no-files-found: error

      - name: Compiler l'installeur (Inno Setup, preinstalle sur windows-latest)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dotnet/installer/OverlayPerf.iss'
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: OverlayPerf-Setup
          path: dotnet/installer/output/OverlayPerf-Setup-*.exe
          if-no-files-found: error

  flutter:
    # Application Android (mobile/) : analyse, tests, puis publication de l'APK
    # (arm64, la quasi-totalite des telephones recents) en artefact du run.
    name: Overlay.apk (Flutter/Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Recuperer les dependances
        working-directory: mobile
        run: flutter pub get

      - name: Analyse statique
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

      - name: Compiler l'APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Overlay-android-arm64
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
