org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Le projet vit sur D: alors que le cache Gradle/Pub est sur C: ; le calcul de
# chemin relatif du compilateur Kotlin incremental (RelocatableFileToPathConverter)
# leve alors "this and base files have different roots" et fait echouer la
# compilation. Desactiver l'incrementalite Kotlin contourne le bug (compile plus
# lentement, mais fonctionne).
kotlin.incremental=false
