name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # La logique de connexion de l'application mobile est testee sous Node ;
      # sans lui, ces tests seraient silencieusement sautes.
      - uses: actions/setup-node@v7
        with:
          # Node 20 est en fin de vie depuis avril 2026 ; 24 est l'actuelle LTS.
          node-version: "24"

      - name: Installer le paquet et ses dependances de developpement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Analyse statique
        run: python -m ruff check src tests tools

      - name: Tests
        run: python -m pytest -q

  horloge-grossiere:
    # Sous Windows, avant Python 3.13, time.monotonic() avance par pas de ~15 ms.
    # Rejouer la suite avec une horloge quantifiee revele ici les tests et le code
    # qui dependent d'un ecart de temps non nul, sans attendre le retour d'un
    # runner Windows.
    name: Tests sous horloge a faible resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          # Node 20 est en fin de vie depuis avril 2026 ; 24 est l'actuelle LTS.
          node-version: "24"

      - name: Installer le paquet et ses dependances de developpement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q -p tests.coarse_clock

  overlay:
    name: Tests avec l'overlay (PySide6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          # Node 20 est en fin de vie depuis avril 2026 ; 24 est l'actuelle LTS.
          node-version: "24"

      - name: Bibliotheques systeme requises par Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Installer avec les extras overlay et serveur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,overlay]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Les icones du paquet sont a jour
        run: |
          python tools/make_icons.py
          git diff --exit-code -- src/overlay/webapp
